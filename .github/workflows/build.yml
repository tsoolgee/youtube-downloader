name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "לפרסם שחרור (רק אם יש תגית)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: "התגית שאליה לפרסם את הקובץ"
        type: string
        required: false

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8      # הפלט של הבנייה בעברית

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0          # צריך היסטוריה מלאה כדי להרכיב פירוט שינויים

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -U yt-dlp pywebview pyinstaller pillow

      - name: Record the yt-dlp version being bundled
        shell: pwsh
        run: |
          $v = python -c "import yt_dlp; print(yt_dlp.version.__version__)"
          "yt-dlp $v" | Tee-Object -FilePath bundled.txt
          "YTDLP=$v" >> $env:GITHUB_ENV

      # אם התגית לא תואמת ל-APP_VERSION, כל התקנה קיימת תציע לעדכן לנצח
      - name: Verify APP_VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: pwsh
        run: |
          $ref = if ("${{ inputs.tag }}") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $tag = $ref.TrimStart('v')
          $ver = (Select-String -Path app.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "tag $tag != APP_VERSION $ver - bump APP_VERSION in app.py first" }
          "VER=$ver" >> $env:GITHUB_ENV
          "version ok: $ver"

      - name: Fetch FFmpeg
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest $url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffsrc
          New-Item -ItemType Directory -Force bin | Out-Null
          Get-ChildItem ffsrc -Recurse -Include ffmpeg.exe |
            ForEach-Object { Copy-Item $_.FullName bin }
          Get-ChildItem bin | Select-Object Name, Length

      - name: Build single EXE
        run: python build.py

      - name: Normalise asset name
        shell: pwsh
        run: |
          # שם הקובץ הבנוי בעברית; גיטהאב לא מקבל שמות נכסים לא-אנגליים
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          Move-Item $exe.FullName "dist/YT-DLP-Studio.exe" -Force
          "{0:N1} MB" -f ((Get-Item "dist/YT-DLP-Studio.exe").Length / 1MB)

      - name: Keep the build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: YT-DLP-Studio-exe
          path: dist/YT-DLP-Studio.exe
          retention-days: 14

      # הפירוט הזה הוא מה שהתוכנה מציגה בחלון "מה השתנה" לפני עדכון
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          prev=$(git tag --sort=-v:refname | grep -v "^${tag}$" | head -1 || true)
          range=$([ -n "$prev" ] && echo "$prev..$tag" || echo "$tag")
          {
            git log --no-merges --pretty=format:'• %s' "$range"
            printf '\n\n'
            printf 'מנוע yt-dlp מצורף: %s\n' "$YTDLP"
          } > notes.md
          cat notes.md

      # שם הנכס חייב להישאר קבוע - עליו נשען הקישור
      # releases/latest/download/YT-DLP-Studio.exe וגם המעדכן שבתוך התוכנה
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: הורדה ניידת מיוטיוב צול גאה ${{ env.VER }}
          files: "dist/YT-DLP-Studio.exe"
          body_path: notes.md

      # גיטהאב חותך עברית משמות קבצים, אבל מקבל אותה בתווית -
      # התווית היא מה שמוצג בעמוד השחרור
      - name: Label the asset in Hebrew
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # בלי jq: ההסלמה של המרכאות בין YAML ל-pwsh שוברת את הביטוי
          $tag = if ("${{ inputs.tag }}") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $rel = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          $id = ($rel.assets | Where-Object { $_.name -eq 'YT-DLP-Studio.exe' }).id
          if (-not $id) { throw "asset YT-DLP-Studio.exe not found on $tag" }
          gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" -f label="יוטיוב הורדה" | Out-Null
          "labelled asset $id"
