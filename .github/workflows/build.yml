name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -U yt-dlp pywebview pyinstaller pillow

      - name: Fetch FFmpeg
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest $url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffsrc
          New-Item -ItemType Directory -Force bin | Out-Null
          Get-ChildItem ffsrc -Recurse -Include ffmpeg.exe,ffprobe.exe |
            ForEach-Object { Copy-Item $_.FullName bin }
          Get-ChildItem bin

      - name: Build single EXE
        run: python build.py

      - name: Normalise asset name
        shell: pwsh
        run: Move-Item "dist/YT-DLP Studio.exe" "dist/YT-DLP-Studio.exe" -Force

      # שם הנכס חייב להישאר קבוע - עליו נשען הקישור
      # releases/latest/download/YT-DLP-Studio.exe וגם המעדכן שבתוך התוכנה
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "dist/YT-DLP-Studio.exe"
          generate_release_notes: true
